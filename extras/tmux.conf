# tws default tmux config. install.sh copies this file to ~/.tmux.conf when you
# say yes to it, and puts the tws binary path in place of @TWS_BIN@.
# The theme needs a Nerd Font in your terminal.

unbind r
bind r source-file ~/.tmux.conf
bind-key '.' command-prompt -I "#S" "rename-session '%%'"

set -g mouse on
set-option -g status-position bottom

# Copy-mode -> system clipboard: pbcopy on macOS, OSC 52 elsewhere.
# -q: an older tmux skips an option it does not know.
set -g set-clipboard on
set -gq allow-passthrough on
set -as terminal-features ",xterm-256color:clipboard"
if-shell 'command -v pbcopy' 'set -sq copy-command pbcopy'
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Stock macOS ncurses has no tmux-256color entry
if-shell 'infocmp tmux-256color' 'set -g default-terminal tmux-256color' 'set -g default-terminal screen-256color'
set -as terminal-features ",xterm-256color:RGB"
set -s extended-keys on
set -sq extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty*:extkeys'

bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Open new panes/windows in the current pane's working directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'o0th/tmux-nova'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Theme customizations
set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left 
set -g @nova-nerdfonts-right 

set -g @nova-pane-active-border-style "#686868"
set -g @nova-pane-border-style "#505050"
set -g @nova-status-style-bg "#1b1b1b"
set -g @nova-status-style-fg "#eeeeee"
set -g @nova-status-style-active-bg "#c88e68"
set -g @nova-status-style-active-fg "#121212"
set -g @nova-status-style-double-bg "#242424"

# tws: agent glyphs on each window tab
set -g @nova-pane "#I#{?pane_in_mode,  #{pane_mode},}  #W#(@TWS_BIN@ bar window --since #{start_time} #{P:#{pane_id} })"

set -g @nova-segment-mode "#{?client_prefix,Ω,ω}"
set -g @nova-segment-mode-colors "#9d7cd8 #121212"

set -g @nova-rows 0
set -g @nova-segments-0-left "mode"
set -g @nova-segments-0-right "tws"

# tws: thread › session at the right end
set -g @nova-segment-tws "#(@TWS_BIN@ bar where -- #{q:session_name})"
set -g @nova-segment-tws-colors "#c88e68 #121212"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
